name: deploy

on:
  push:
    # premium-redesign is the repo default branch (where PRs land); main is kept aligned
    branches: [premium-redesign, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ---- frontend: build SPA, deploy to GitHub Pages ----
  frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            platform-admin/package-lock.json
            feldnstein-react/package-lock.json

      # storefront at the Pages root (public site), admin SPA under /admin/
      - name: Build storefront (Pages root)
        working-directory: feldnstein-react
        env:
          VITE_SITE_API: ${{ vars.VITE_API_BASE }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Build admin SPA (under /admin/)
        working-directory: platform-admin
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_BASE: /${{ github.event.repository.name }}/admin/
        run: |
          npm ci
          npm run build

      - name: Merge artifacts
        run: |
          mkdir -p _site
          cp -r feldnstein-react/dist/* _site/
          mkdir -p _site/admin
          cp -r platform-admin/dist/* _site/admin/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # ---- backend: build image, push to GHCR (Render deploys from the repo blueprint) ----
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: platform-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/feldnstein-platform-backend:latest
            ghcr.io/${{ github.repository_owner }}/feldnstein-platform-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
