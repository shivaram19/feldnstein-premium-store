name: deploy

on:
  push:
    # premium-redesign is the repo default branch (where PRs land); main is kept aligned
    branches: [premium-redesign, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ---- frontend: build SPA, deploy to GitHub Pages ----
  frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform-admin/package-lock.json

      - name: Build SPA
        working-directory: platform-admin
        env:
          # Backend origin the deployed SPA calls (set as a repo variable once the
          # Render service exists). Falls back to same-origin for dry runs.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          # Pages serves project sites under /<repo>/.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform-admin/dist

      - id: deploy
        uses: actions/deploy-pages@v4

  # ---- backend: build image, push to GHCR (Render deploys from the repo blueprint) ----
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: platform-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/feldnstein-platform-backend:latest
            ghcr.io/${{ github.repository_owner }}/feldnstein-platform-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
