quarkus.http.port=8080

# --- RBAC demo realm (ADR-0005): file-realm Basic auth, NEVER for production ---
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=admin123
quarkus.security.users.embedded.users.ops=ops123
quarkus.security.users.embedded.users.cust=cust123
quarkus.security.users.embedded.roles.admin=ADMIN
quarkus.security.users.embedded.roles.ops=OPERATOR
quarkus.security.users.embedded.roles.cust=CUSTOMER

# advertise Basic auth in Swagger UI so the Authorize button works
quarkus.smallrye-openapi.security-scheme=basic
quarkus.smallrye-openapi.security-scheme-name=BasicAuth

# CORS: the deployed SPA (GitHub Pages) calls the backend cross-origin; local dev goes
# through the Vite proxy (same-origin) and is unaffected. Demo-grade — tighten before launch.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://shivaram19.github.io,http://localhost:5173
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# gaanugu schema owned by Flyway (V1+); Hibernate validates against it
quarkus.hibernate-orm.database.generation=update
quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.sql-load-script=import.sql

%dev.quarkus.datasource.db-kind=h2
# DB_CLOSE_DELAY=-1 keeps the in-memory DB alive while the JVM runs; without it the
# database is destroyed whenever the connection pool idles to zero.
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:platform;DB_CLOSE_DELAY=-1

%prod.quarkus.datasource.db-kind=postgresql
# Render's managed Postgres exposes host/port/name/user/pass as separate env vars
# (fromDatabase), so the JDBC URL is composed here rather than passed whole.
# DB_JDBC_URL overrides everything (paste Render's internal connectionString in JDBC form).
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:feldnstein}?sslmode=require&connectTimeout=10}
%prod.quarkus.datasource.username=${DB_USER:feldnstein}
%prod.quarkus.datasource.password=${DB_PASS:feldnstein}
