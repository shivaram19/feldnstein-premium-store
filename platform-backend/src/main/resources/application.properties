quarkus.http.port=8080

# --- RBAC demo realm (ADR-0005): file-realm Basic auth, NEVER for production ---
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=admin123
quarkus.security.users.embedded.users.ops=ops123
quarkus.security.users.embedded.users.cust=cust123
quarkus.security.users.embedded.roles.admin=ADMIN
quarkus.security.users.embedded.roles.ops=OPERATOR
quarkus.security.users.embedded.roles.cust=CUSTOMER

# advertise Basic auth in Swagger UI so the Authorize button works
quarkus.smallrye-openapi.security-scheme=basic
quarkus.smallrye-openapi.security-scheme-name=BasicAuth

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:platform

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/feldnstein}
%prod.quarkus.datasource.username=${DB_USER:feldnstein}
%prod.quarkus.datasource.password=${DB_PASS:feldnstein}
