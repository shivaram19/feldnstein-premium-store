# Render blueprint (ADR-0012). One-time setup: Render dashboard → New → Blueprint →
# select this repo. On every push to main, Render rebuilds and deploys the backend;
# GitHub Actions deploys the SPA to Pages in the same push.

services:
  - type: web
    name: feldnstein-platform-backend
    runtime: docker
    rootDir: platform-backend
    plan: free
    healthCheckPath: /q/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: feldnstein-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: feldnstein-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: feldnstein-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: feldnstein-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: feldnstein-db
          property: password
      # Media storage (ADR-0013): set these in the Render dashboard once an R2 bucket
      # exists. sync:false = secret, entered manually. Until set, media admin endpoints
      # return 503 with a clear message (startup probe logs the missing vars).
      - key: MEDIA_PUBLIC_BASE_URL
        value: https://feldnstein-platform-backend.onrender.com
      - key: MEDIA_STORAGE_TYPE
        value: s3
      - key: MEDIA_S3_ENDPOINT
        sync: false
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false

databases:
  - name: feldnstein-db
    plan: free
    databaseName: feldnstein
